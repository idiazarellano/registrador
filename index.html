    setTimeout(()=>{const i=$('#confirmInput');if(i)i.focus();},50);
  } else if(state.sheet==='import'){
    o.innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Restaurar copia">
      <div class="handle"></div><h2>Restaurar copia</h2>
      <p style="margin:0;color:var(--ink-2);font-size:14px">${state.importData.entries.length} registros y ${state.importData.categories.length} categorías.</p>
      <button class="btn" data-act="import-merge">Añadir los que falten (recomendado)</button>
      <button class="btn danger" data-act="import-replace">Reemplazar todo lo actual</button>
      <button class="btn ghost" data-close>Cancelar</button></div></div>`;
  }
}
function closeSheet(){state.sheet=null;state.editing=null;state.catEdit=null;state.catDel=null;state.resume=null;state.taskEdit=null;renderSheet();}

/* ============ Eventos ============ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-close]'); if(!t) return;
  const d=t.dataset;
  if(t.hasAttribute('data-close')&&t===ev.target||t.matches('button[data-close]')){closeSheet();return;}
  if(d.view){ if(d.view!=='ajustes')state.prevView=d.view; state.view=d.view; render(); window.scrollTo(0,0); return;}
  if(d.goto){state.selDay=dayStart(+d.day);state.prevView=state.view=d.goto;render();window.scrollTo(0,0);return;}
  if(d.mark&&d.markday){ if(lp.fired){lp.fired=false;return;} toggleMark(d.mark,+d.markday);render();return;}
  if(d.bal&&d.side){ if(lp.fired){lp.fired=false;return;} addBalance(d.bal,d.side,+d.balday); render(); if(navigator.vibrate) navigator.vibrate(8); return;}
  if(d.balundo){ if(undoBalance(d.balundo,+d.balday)){render();toast('Deshecho el último');} return;}
  if(d.baledit){const b=balById(d.baledit);state.catEdit={kind:'balance',id:b.id,name:b.name,color:b.color,icon:b.icon||'',a:b.a.label,b:b.b.label};state.sheet='cat';renderSheet();return;}
  if(d.markedit){const m=markById(d.markedit);state.catEdit={kind:'mark',id:m.id,name:m.name,color:m.color,icon:m.icon||''};state.sheet='cat';renderSheet();return;}
  if(d.tgroup){state.taskClosed=state.taskClosed.includes(d.tgroup)?state.taskClosed.filter(x=>x!==d.tgroup):state.taskClosed.concat(d.tgroup);render();return;}
  if(d.tdone){const t=data.tasks.find(x=>x.id===d.tdone);if(t){t.done=!t.done;t.doneAt=t.done?Date.now():0;save();render();}return;}
  if(d.task){const t=data.tasks.find(x=>x.id===d.task);if(t){state.taskEdit={id:t.id,text:t.text,cat:t.cat};state.sheet='task';renderSheet();}return;}
  if(d.taskcat){state.taskEdit.cat=d.taskcat;document.querySelectorAll('[data-taskcat]').forEach(b=>b.classList.toggle('on',b.dataset.taskcat===d.taskcat));return;}
  if(d.start){ if(lp.fired){lp.fired=false;return;} startCategory(d.start);return;}
  if(d.edit){const e=data.entries.find(x=>x.id===d.edit);if(e)openEditor(e);return;}
  if(d.gapStart){openEditor({id:null,cat:(activeCats()[0]||data.categories[0]||{}).id,start:+d.gapStart,end:+d.gapEnd});return;}
  if(d.adj){const r=running();if(!r)return;if(setRunningStart(r.start+(+d.adj)*MIN))render();return;}
  if(d.radj){setPendEnd(pendEnd()+(+d.radj)*MIN);return;}
  if(d.range){state.range=+d.range;render();return;}
  if(d.analysis){state.analysis=d.analysis;render();return;}
  if(d.statcat){state.statCat=d.statcat;render();return;}
  if(d.weeks){state.weeks=+d.weeks;render();return;}
  if(d.day){state.selDay=dayStart(+d.day);render();return;}
  if(d.cat){const c=catById(d.cat);state.catEdit={id:c.id,name:c.name,color:c.color,icon:c.icon||''};state.sheet='cat';renderSheet();return;}
  if(d.theme){data.settings.theme=d.theme;save();render();return;}
  if(d.move){const act=activeCats();const i=act.findIndex(c=>c.id===d.move),j=i+(+d.dir);if(j<0||j>=act.length)return;const gi=data.categories.indexOf(act[i]),gj=data.categories.indexOf(act[j]);[data.categories[gi],data.categories[gj]]=[data.categories[gj],data.categories[gi]];save();render();return;}
  if(d.unarchive){catById(d.unarchive).archived=false;save();render();return;}
  if(d.gran){data.settings.granularity=+d.gran;save();render();return;}
  if(d.bmode){data.settings.backupMode=d.bmode;save();render();return;}
  if(d.insert){openInsertEditor(+d.insert);return;}
  if(d.rest){toggleRest(+d.rest);render();toast(isRest(+d.rest)?'Marcado como día de descanso':'Ya no es día de descanso');return;}
  // sheet: editor
  if(d.pick){state.editing.cat=d.pick;renderSheet();return;}
  if(d.deltarget){state.catDel.target=d.deltarget;renderSheet();return;}
  if(d.tadj){const f=t.closest('[data-field]').dataset.field;state.editing[f]+=(+d.tadj)*MIN;renderSheet();return;}
  if(d.snap){state.editing[d.snap]=+d.ms;renderSheet();return;}
  // Icono y color se actualizan en el sitio, sin volver a pintar la hoja: si se repintara,
  // el scroll de emojis saltaría arriba y el foco automático abriría el teclado.
  if(d.color){state.catEdit.color=d.color;document.querySelectorAll('.swatches button').forEach(b=>b.classList.toggle('on',b.dataset.color===d.color));return;}
  if(d.icon!=null&&state.sheet==='cat'){state.catEdit.icon=d.icon;$('#catIcon').value=d.icon;document.querySelectorAll('.iconpick button').forEach(b=>b.classList.toggle('on',b.dataset.icon===d.icon));return;}
  switch(d.act){
    case 'stop': stopRunningAt(pendEnd()); break;
    case 'startfrom': state.startFrom=+d.ms; render(); break;
    case 'resume-continue': {const rs=state.resume,last=data.entries.find(e=>e.id===rs.id); if(last){last.end=null;} closeSheet(); save(); render(); break;}
    case 'resume-gap': {const rs=state.resume; data.entries.push({id:uid(),cat:rs.cat,start:rs.now,end:null}); sortEntries(); closeSheet(); save(); render(); break;}
    case 'startfrom-cancel': state.startFrom=null; render(); break;
    case 'edit-cats': state.prevView=state.view; state.view='ajustes'; render(); window.scrollTo(0,0); break;
    case 'new-balance': state.catEdit={kind:'balance',id:null,name:'',color:PALETTE.find(h=>!data.balances.some(b=>b.color===h))||PALETTE[0],icon:'',a:'',b:''};state.sheet='cat';renderSheet(); break;
    case 'balance-delete': {
      const id=state.catEdit.id;
      if(!confirm('¿Eliminar esta balanza? Se pierden las ocasiones apuntadas.')) return;
      data.balances=data.balances.filter(b=>b.id!==id);
      data.balanceLog=data.balanceLog.filter(x=>x.bid!==id);
      save(); closeSheet(); render(); break; }
    case 'new-mark': state.catEdit={kind:'mark',id:null,name:'',color:PALETTE.find(h=>!data.marks.some(m=>m.color===h))||PALETTE[0],icon:''};state.sheet='cat';renderSheet(); break;
    case 'mark-delete': {
      const id=state.catEdit.id;
      if(!confirm('¿Eliminar esta marca? Se pierden los días marcados.')) return;
      data.marks=data.marks.filter(m=>m.id!==id);
      for(const k of Object.keys(data.markDays)){const r=data.markDays[k].filter(x=>x!==id); if(r.length)data.markDays[k]=r; else delete data.markDays[k];}
      save(); closeSheet(); render(); break; }
    case 'new-task': state.taskEdit={id:null,text:'',cat:d.tcat||(activeCats()[0]||{}).id};state.sheet='task';renderSheet(); break;
    case 'task-save': {
      const te=state.taskEdit, text=$('#taskText').value.trim();
      if(!text){toast('Escribe la tarea');return;}
      if(!te.cat){toast('Elige una categoría');return;}
      if(te.id){const t=data.tasks.find(x=>x.id===te.id); if(t){t.text=text;t.cat=te.cat;}}
      else data.tasks.push({id:uid(),cat:te.cat,text,done:false,created:Date.now(),doneAt:0});
      state.taskClosed=state.taskClosed.filter(x=>x!==te.cat);
      save(); closeSheet(); render(); break; }
    case 'task-delete': if(confirm('¿Eliminar esta tarea?')){data.tasks=data.tasks.filter(t=>t.id!==state.taskEdit.id);save();closeSheet();render();} break;
    case 'tasks-clear': if(confirm('¿Borrar las tareas hechas?')){data.tasks=data.tasks.filter(t=>!t.done);save();render();} break;
    case 'join-prev': {const r=running();const p=prevEntry(r);if(p){r.start=endOf(p);save();render();}break;}
    case 'manual': newManualEntry(dayStart(Date.now())); break;
    case 'manual-day': newManualEntry(state.selDay); break;
    case 'new-cat': state.catEdit={id:null,name:'',color:PALETTE.find(h=>!data.categories.some(c=>c.color===h))||PALETTE[0],icon:''};state.sheet='cat';renderSheet(); break;
    case 'backup': doBackup(); break;
    case 'share': shareBackup(); break;
    case 'export-csv': saveFile(backupName('.csv'),exportCSV()); break;
    case 'import': $('#importFile').click(); break;
    case 'import-merge': importJSON(state.importText,'merge');closeSheet(); break;
    case 'import-replace': if(confirm('Se reemplazarán todos los registros y categorías actuales. ¿Continuar?')){importJSON(state.importText,'replace');closeSheet();} break;
    case 'wipe': state.sheet='wipe'; renderSheet(); break;
    case 'wipe-go': {
      const n=data.entries.length, v=($('#confirmInput')||{}).value||'';
      if(v.trim()!==String(n)){toast('Escribe '+n+' para confirmar');return;}
      doBackup().then(ok=>{ if(!ok){toast('Sin copia no se borra');return;} if(wipeEntries()){closeSheet();render();toast('Registros borrados');} });
      break; }
    case 'wipe-undo': undoWipe(); break;
    case 'nuke': state.sheet='nuke'; renderSheet(); break;
    case 'nuke-go': {
      const v=($('#confirmInput')||{}).value||'';
      if(v.trim()!=='BORRAR'){toast('Escribe BORRAR para confirmar');return;}
      nukeEverything(); break; }
    case 'edit-merge-prev': {
      const e=data.entries.find(x=>x.id===state.editing.id), p=e&&prevEntry(e); if(!p) return;
      e.start=p.start; deleteEntry(p.id); state.editing.start=e.start; save(); renderSheet(); toast('Registros unidos'); break; }
    case 'edit-stop': {const e=data.entries.find(x=>x.id===state.editing.id);if(e){e.end=Math.max(e.start+STEP()*MIN,roundTo(Date.now()));state.editing.end=e.end;save();renderSheet();}break;}
    case 'edit-delete': if(confirm('¿Eliminar este registro?')){deleteEntry(state.editing.id);closeSheet();render();} break;
    case 'edit-save': saveEditing(); break;
    case 'cat-save': {
      const name=$('#catName').value.trim(); if(!name){toast('Escribe un nombre');return;}
      const icon=$('#catIcon').value.trim();
      const ce=state.catEdit;
      if(ce.kind==='balance'){
        const la=$('#balA').value.trim(), lb=$('#balB').value.trim();
        if(!la||!lb){toast('Escribe los dos lados');return;}
        if(ce.id){const b=balById(ce.id);b.name=name;b.color=ce.color;b.icon=icon;b.a={label:la};b.b={label:lb};}
        else data.balances.push({id:uid(),name,color:ce.color,icon,archived:false,a:{label:la},b:{label:lb}});
      }
      else if(ce.kind==='mark'){
        if(ce.id){const m=markById(ce.id);m.name=name;m.color=ce.color;m.icon=icon;}
        else data.marks.push({id:uid(),name,color:ce.color,icon,archived:false});
      }
      else if(ce.id){const c=catById(ce.id);c.name=name;c.color=ce.color;c.icon=icon;}
      else data.categories.push({id:uid(),name,color:ce.color,icon});
      save(); closeSheet(); render(); break; }
    case 'cat-archive': {
      const c=catById(state.catEdit.id); c.archived=!c.archived;
      if(c.archived&&activeCats().length===0){c.archived=false;toast('Debe quedar al menos una categoría activa');return;}
      save(); closeSheet(); render(); toast(c.archived?'Categoría archivada: sus registros se conservan':'Categoría restaurada'); break; }
    case 'cat-delete': {
      const id=state.catEdit.id, n=data.entries.filter(e=>e.cat===id).length;
      if(data.categories.length<=1){toast('Debe quedar al menos una categoría');return;}
      if(!n){ if(confirm('¿Eliminar esta categoría? No tiene registros.')){data.categories=data.categories.filter(c=>c.id!==id);save();closeSheet();render();} return; }
      state.catDel={id,n,target:null}; state.sheet='catdel'; renderSheet(); break; }
    case 'catdel-go': {
      const {id,target}=state.catDel; if(!target){toast('Elige a qué categoría pasar los registros');return;}
      for(const e of data.entries) if(e.cat===id) e.cat=target;
      data.categories=data.categories.filter(c=>c.id!==id);
      save(); closeSheet(); render(); toast('Registros movidos a '+catById(target).name); break; }
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.rinput){
    const [h,m]=t.value.split(':').map(Number); if(isNaN(h)) return;
    const r=running(); if(!r) return;
    const f=t.dataset.rinput, ms=dayStart(f==='start'?r.start:pendEnd())+h*HOUR+m*MIN;
    if(f==='start'){ if(setRunningStart(ms)) render(); } else setPendEnd(ms);
    return;
  }
  if(t.dataset.tinput){
    const [h,m]=t.value.split(':').map(Number); if(isNaN(h)) return;
    const f=t.dataset.tinput, base=dayStart(state.editing[f]);
    state.editing[f]=base+h*HOUR+m*MIN; renderSheet();
  }
  if(t.id==='importFile'&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{state.importText=fr.result;state.importData=migrate(JSON.parse(fr.result));state.sheet='import';renderSheet();}catch(e){toast('El archivo no es una copia válida');}};
    fr.readAsText(t.files[0]); t.value='';
  }
});
// Pulsación larga (500 ms) sobre una categoría de la pantalla principal: abre su edición.
let lp={timer:null,fired:false,x:0,y:0,el:null};
const LP_SEL='.chip[data-start],.markchip[data-mark],.balbtn[data-bal]';
function lpClear(){clearTimeout(lp.timer);lp.timer=null;if(lp.el){lp.el.classList.remove('holding','lp');lp.el=null;}}
document.addEventListener('pointerdown',ev=>{
  const chip=ev.target.closest(LP_SEL); if(!chip) return;
  lp.fired=false; lp.x=ev.clientX; lp.y=ev.clientY;
  lp.el=chip; chip.classList.add('lp'); requestAnimationFrame(()=>{if(lp.el===chip)chip.classList.add('holding');});
  lp.timer=setTimeout(()=>{lp.fired=true; if(navigator.vibrate) navigator.vibrate(15);
    lpClear();
    const kind=chip.dataset.bal?'balance':chip.dataset.mark?'mark':'cat';
    const o=kind==='balance'?balById(chip.dataset.bal):kind==='mark'?markById(chip.dataset.mark):catById(chip.dataset.start);
    state.catEdit={kind,id:o.id,name:o.name,color:o.color,icon:o.icon||''};
    if(kind==='balance'){state.catEdit.a=o.a.label;state.catEdit.b=o.b.label;}
    state.sheet='cat'; renderSheet();},500);
});
document.addEventListener('pointermove',ev=>{ if(lp.timer&&Math.hypot(ev.clientX-lp.x,ev.clientY-lp.y)>10) lpClear(); });
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lpClear));
document.addEventListener('contextmenu',ev=>{ if(ev.target.closest(LP_SEL)) ev.preventDefault(); });
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.sheet)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();autoBackupIfDue();}});
window.addEventListener('storage',ev=>{if(ev.key===KEY){data=load();render();}});

// reloj: el cronómetro cada segundo, la barra cada minuto
setInterval(()=>{const el=$('#elapsed'),r=running();if(el&&r)el.textContent=fmtClock(Math.max(0,Date.now()-r.start));},1000);
setInterval(()=>{if(state.view==='hoy'&&!state.sheet)render();},60000);
render();
autoBackupIfDue();
// Service worker solo cuando la app se sirve desde su propio sitio (GitHub Pages), no desde un archivo local.
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
