<style>
:root{
  color-scheme:light;
  --bg:#f4f3ee; --surface:#ffffff; --surface-2:#ebe9e2; --surface-3:#dfdcd2;
  --ink:#1c1b18; --ink-2:#5f5c55; --ink-3:#8f8b82; --line:#dcd9d0;
  --accent:#1f5fc4; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --danger:#c8362f; --danger-soft:#fbe5e3; --ok:#1c7a3d;
  --shadow:0 10px 30px rgba(28,27,24,.18);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151614; --surface:#1f201d; --surface-2:#2a2b27; --surface-3:#363731;
    --ink:#f1efe8; --ink-2:#b4b1a8; --ink-3:#7f7c74; --line:#34352f;
    --accent:#6ea1f2; --accent-ink:#0e1a2e; --accent-soft:#1f2b40;
    --danger:#f07a72; --danger-soft:#3a1f1d; --ok:#5fc07d;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151614; --surface:#1f201d; --surface-2:#2a2b27; --surface-3:#363731;
  --ink:#f1efe8; --ink-2:#b4b1a8; --ink-3:#7f7c74; --line:#34352f;
  --accent:#6ea1f2; --accent-ink:#0e1a2e; --accent-soft:#1f2b40;
  --danger:#f07a72; --danger-soft:#3a1f1d; --ok:#5fc07d;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:640px;margin:0 auto}
main{flex:1;padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px}
.tabs{position:sticky;bottom:0;margin-top:auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .inner{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.iconbtn{width:36px;height:36px;flex:none;border-radius:10px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:20px;font-weight:800}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Marcas: eventos de sí/no del día. */
.marks{display:flex;flex-wrap:wrap;gap:8px}
.markchip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.markchip.on{border-color:var(--mc);background:color-mix(in srgb, var(--mc) 14%, var(--surface));color:var(--ink)}
.markchip.on::before{content:'✓';font-weight:900;color:var(--mc)}
/* Balanzas: ocasiones con dos salidas excluyentes. Los dos lados pesan igual: mismo tamaño,
   sin verde ni rojo, para que apuntar un lado no cueste más que apuntar el otro. */
.balances{display:flex;flex-direction:column}
.balance{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.balance:last-child{border-bottom:0}
.balhead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.balhead small{font-weight:600;font-size:12px;color:var(--ink-3)}
.balsides{display:flex;gap:8px;align-items:stretch}
.balbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);text-align:left}
.balbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balbtn b{flex:none;font-size:15px;font-weight:800;color:var(--ink)}
.balbtn.has{border-color:var(--bc);background:color-mix(in srgb, var(--bc) 12%, var(--surface))}
.balundo{flex:none;width:40px;border-radius:12px;background:var(--surface-2);color:var(--ink-3);font-size:16px}
.balbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.balbar i{display:block;height:100%}
/* Tareas: listas desplegables por categoría. */
.taskgroup{padding-top:6px;padding-bottom:6px}
.grouphead{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;text-align:left;font-weight:700}
.grouphead .count{min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.grouphead .chev{color:var(--ink-3)}
.tasks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tcheck{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:900;color:var(--accent);line-height:1}
.task.done .tcheck{border-color:var(--accent);background:var(--accent-soft)}
.task .ttext{flex:1;min-width:0;text-align:left;font-size:14px;padding:4px 0}
.task.done .ttext{text-decoration:line-through;color:var(--ink-3)}
.taskadd{align-self:flex-start;margin-top:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--ink-3)}
.taskadd:active{color:var(--accent)}
/* Realimentación del «mantener pulsado»: se encoge y una línea recorre el elemento. */
.lp{position:relative;transition:transform .12s ease}
.lp.holding{transform:scale(.96)}
.lp.holding::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);border-radius:2px;animation:lpfill .5s linear forwards;pointer-events:none}
@keyframes lpfill{from{width:0}to{width:100%}}
.tplay{width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:12px}
/* Barras verticales apiladas: día tipo y día de la semana. */
.hourbars{display:flex;align-items:flex-end;gap:2px;height:132px;margin-top:12px}
.hcol{flex:1;min-width:0;height:100%}
.vbar{height:100%;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:3px;overflow:hidden}
.vstack{width:100%;display:flex;flex-direction:column-reverse;min-height:1px}
.vstack i{display:block;width:100%;min-height:0}
.dowbars{display:flex;align-items:flex-end;gap:6px;margin-top:12px}
.dcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.dcol .vbar{height:120px;width:100%}
.dcol .dlab{font-size:12px;font-weight:800;color:var(--ink-2)}
.dcol .dval{font-size:10px;color:var(--ink-3)}
.weeksvg{width:100%;height:120px;margin-top:12px;color:var(--ink)}
.statbars{display:flex;flex-direction:column;gap:6px}
.seg-control.small{flex-wrap:wrap}
.seg-control.small button{flex:1 1 28%;font-size:12px;padding:7px 2px}
/* Tipos de día: agrupación y mapa. */
.kcard{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.kcard:last-child{border-bottom:0}
.kdot{width:14px;height:14px;border-radius:4px;flex:none;margin-top:3px}
.kstrip{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.kcell{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.kcell.none{background:var(--surface-2);color:var(--ink-3)}
.mapsvg{width:100%;height:200px;margin-top:8px;color:var(--ink-3)}
.delta{font-weight:700}
.delta.up,.delta.down{color:var(--ink-2)}
.delta.flat{color:var(--ink-3)}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.topbar .sub{color:var(--ink-2);font-size:13px}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
/* day bar */
.daybar{position:relative;height:38px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.daybar .seg{position:absolute;top:0;bottom:0;border-right:2px solid var(--surface);border-left:0;min-width:1px;overflow:hidden}
.daybar .seg.run{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);animation:march 1.6s linear infinite}
@keyframes march{from{background-position:0 0}to{background-position:28px 0}}
@media (prefers-reduced-motion:reduce){.daybar .seg.run{animation:none}}
.daybar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);z-index:2}
.daybar.small{height:20px;border-radius:5px}
.daybar.small .seg{border-right-width:1px}
.ticks{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--ink-3)}
.ticks.cols{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;justify-content:initial}
.ticks.cols span{width:auto;grid-row:1;text-align:center;display:block}
.ticks span{width:0;text-align:center;display:inline-flex;justify-content:center}

.iconpick{display:flex;flex-wrap:wrap;gap:4px}
.iconscroll{max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;overscroll-behavior:contain}
.iconpick button{width:38px;height:38px;border-radius:9px;background:var(--surface-2);font-size:18px;border:2px solid transparent}

.entry:first-child{border-radius:12px 12px 4px 4px}.entry:last-child{border-radius:4px 4px 12px 12px}.entry:only-child{border-radius:12px}
.entry .stripe{align-self:stretch;border-radius:2px}
.entry .times{font-size:13px;color:var(--ink-2)}

.danger-zone{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

.confirm-input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;font-weight:700;color:var(--ink);text-align:center;letter-spacing:.06em}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section-head h2{font-size:14px;font-weight:800}

.sheet-head{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:8px}
/* Editor de registro: inicio a la izquierda, fin a la derecha, duración en medio. */
.startend{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.se{display:flex;flex-direction:column;gap:6px;min-width:0}
.se .label{text-align:center}
.se input[type=time]{width:100%;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 2px;font-family:var(--mono);font-size:17px}
.now-panel .se-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.se-adj{display:flex;gap:4px}
.se-adj button{flex:1;min-width:0;height:36px;border-radius:9px;background:var(--surface-2);font-weight:700;font-size:12px}
.se-adj button:active{background:var(--surface-3)}
.se .linkbtn{font-size:11px;line-height:1.3;text-align:center}

.catpick{display:flex;flex-wrap:wrap;gap:6px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.spread{justify-content:space-between}
.durline{font-size:13px;color:var(--ink-2)}
/* Fila de botones siempre visible al pie de una hoja: sticky con `bottom` negativo
   para comerse el padding inferior de .sheet y quedar pegada al borde. */
.sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));z-index:1;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin:0 0 calc(-20px - env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}

.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swatches button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
input.text{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px}
/* records */
.seg-control{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg-control button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg-control button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dayrows{display:flex;flex-direction:column;gap:6px}

.dayrow.on{background:var(--surface-2)}
.dayrow.rest .d{color:var(--ink-3)}

.restbtn{font-size:12px;font-weight:700;color:var(--ink-3);padding:4px 8px;border-radius:8px;border:1px solid var(--surface-2);white-space:nowrap}
.restbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dayrow .d{font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.15}
.dayrow .d small{display:block;font-weight:500;color:var(--ink-3)}
.dayrow .h{font-size:12px;color:var(--ink-2);text-align:right}
.totals{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.trow .n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.trow .n .dot{width:10px;height:10px}
.trow .v{font-size:13px;color:var(--ink-2);text-align:right}
.trow .bar{grid-column:1/-1;height:10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:4px}
.trow .sub{grid-column:1/-1;font-size:11px;color:var(--ink-3)}
.trow.unassigned{margin-top:2px;padding-top:10px;border-top:1px dashed var(--line)}
.trow.unassigned .n{color:var(--ink-2);font-weight:600}
.dot.hollow{background:transparent!important;border:1.5px dashed var(--ink-3);box-sizing:border-box}
.daytot{margin:10px 0 0;font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.daytot span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.daytot b{font-weight:700;color:var(--ink)}
.daytot .pct{color:var(--ink-3)}
.daytot .un{color:var(--ink-3);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px}
/* settings */
.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list > *:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .desc{font-size:12px;color:var(--ink-3)}
.list .chev{color:var(--ink-3)}
.list .catrow{padding:4px 0}
.list .catrow > button.grow{display:flex;align-items:center;gap:12px;padding:8px 0;text-align:left}
.list .mv{width:36px;height:36px;border-radius:8px;background:var(--surface-2);font-size:11px;color:var(--ink-2);flex:none}
.list .mv:disabled{opacity:.3}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.banner .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:40;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.mono-small{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayhead button{padding:6px 10px;border-radius:8px;background:var(--surface-2);font-weight:800}
</style>

<body>

<div id="app">
  <main id="view"></main>
  <nav class="tabs" aria-label="Secciones"><div class="inner" id="tabs"></div></nav>
</div>
<div id="overlay"></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============ Datos y persistencia ============
   Todo vive en localStorage bajo KEY. La estructura lleva `schema`;
   migrate() convierte versiones antiguas, así una actualización de la app
   nunca requiere borrar datos. */
const KEY='registrador.v1';
const KEY_PREV='registrador.v1.prev';   // (antiguo) copia del día anterior; se conserva como último recurso
const KEY_SNAP='registrador.v1.snap.';  // copias internas diarias: KEY_SNAP+'AAAA-MM-DD'
const SNAP_DAYS=7;
const KEY_TRASH='registrador.v1.trash'; // papelera tras 'Borrar todos los registros' (30 días)
const TRASH_DAYS=30;
const SCHEMA=4;
const MIN=60000, HOUR=3600000, DAY=86400000;
// 4 filas × 8 tonos (rojo→rosa): vivos, oscuros, suaves, neutros/tierra
const PALETTE=[
  '#e34948','#eb6834','#eda100','#3fa34d','#1baf7a','#2a78d6','#7c3aed','#e87ba4',
  '#9b1c1c','#a34a12','#a87400','#1f6b2e','#0f6e5e','#1c4fa0','#4a3aa7','#b0306e',
  '#f0a3a2','#f6b48f','#f3d17a','#a8d8a0','#8fd8c2','#9ec5f4','#c4b5f7','#f4c2d7',
  '#374151','#6b7280','#9ca3af','#78350f','#8a5a2b','#b45309','#c9a27e','#a8a29e'];
const ICON_GROUPS=[
  ['Trabajo','💼 💻 🖥️ ⌨️ 📞 📧 📝 📊 📈 📋 🗂️ 🧾 📎 🖨️ 🏢 🏭 🔧 🛠️ ⚙️ 🧪 🔬 🧑‍🏫 🧑‍💻 🧑‍🔧 👷 🏗️ 📐 🧮 💡 🎯'],
  ['Estudio','📚 📖 ✍️ 🎓 🧠 📓 🗒️ 🔍 🌐 🗣️ 🇬🇧 🎧 🖊️ 📏 🧑‍🎓'],
  ['Reuniones','👥 🤝 🗓️ 📅 🎤 🗣️ 💬 📣 🏛️ 🧑‍💼'],
  ['Comida','🍽️ ☕ 🍵 🥐 🍳 🥗 🍎 🍕 🍔 🍜 🍷 🍺 🧁 🍫 🥤 🧑‍🍳 🛒 🥕'],
  ['Casa','🏠 🧹 🧺 🧼 🛁 🚿 🛏️ 🪴 🌱 🔨 🧰 🗑️ 🧾 💳 🐕 🐈 🐾 👶 🧒 👨‍👩‍👧 🎂 🎁'],
  ['Desplazamiento','🚗 🚌 🚆 🚇 🚲 🛵 🚶 ✈️ ⛽ 🅿️ 🗺️ 🧳'],
  ['Deporte','🏃 🏋️ 🚴 🏊 ⚽ 🏀 🎾 🥾 🧗 🧘 ⛰️ 🏓 🥊 🏌️ ⛷️ 🤸'],
  ['Descanso','😴 🛌 ☕ 📺 🎬 🎮 🎵 🎸 🎹 🎨 📷 🧩 ♟️ 🎲 📻 🛋️ 🌅 🌙 🌳 🏖️ 🎣 🍿'],
  ['Salud','🩺 💊 🏥 🦷 🧴 💆 🧖 🧠 ❤️ 🩹 👓 🧘'],
  ['Social','🍻 🎉 💃 🎭 🎤 📱 💬 👫 🫂 📞 🎳'],
  ['Otros','⭐ ✅ ❓ ⏳ 🕒 📌 🔖 🏷️ 🔔 🧭 🚩 💤 🌀 🔥 💧 ⚡ 🧿 🪙 💰 🛍️ 🕊️ 🐢 🦉 🐝 🐳 🦋 🌈 🌍 🎈 🧸'],
].map(([n,list])=>[n,list.split(' ')]);
const STEP=()=>data.settings.granularity||5; // minutos
const roundTo=(ms,step=STEP())=>Math.round(ms/(step*MIN))*(step*MIN);

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function defaultData(){
  return {schema:SCHEMA,
    categories:[
      {id:'c1',name:'Trabajo',color:'#2a78d6',icon:'💻'},
      {id:'c2',name:'Reuniones',color:'#eb6834',icon:'👥'},
      {id:'c3',name:'Descanso',color:'#1baf7a',icon:'☕'},
      {id:'c4',name:'Comida',color:'#eda100',icon:'🍽️'},
      {id:'c5',name:'Desplazamiento',color:'#4a3aa7',icon:'🚗'},
      {id:'c6',name:'Personal',color:'#e87ba4',icon:'🏠'},
      {id:'c7',name:'Deporte',color:'#3fa34d',icon:'🏃'},
      {id:'c8',name:'Sueño',color:'#6b7280',icon:'😴'}],
    entries:[],
    restDays:[],
    marks:[],      // eventos de sí/no: {id,name,icon,color,archived}
    markDays:{},   // 'AAAA-MM-DD' -> [id de marca]
    tasks:[],      // recordatorios: {id,cat,text,done,created,doneAt}
    balances:[],   // ocasiones de dos salidas: {id,name,icon,color,archived,a:{label},b:{label}}
    balanceLog:[], // una ocasión resuelta: {id,bid,side:'a'|'b',t}
    settings:{backupMode:'auto',theme:'system',granularity:5},
    meta:{created:Date.now(),updated:Date.now(),lastBackup:0,lastBackupUpdated:0}};
}
function migrate(d){
  if(!d||typeof d!=='object') return defaultData();
  if(!d.schema) d.schema=1;
  d.categories=Array.isArray(d.categories)?d.categories:[];
  d.entries=Array.isArray(d.entries)?d.entries:[];
  d.restDays=Array.isArray(d.restDays)?d.restDays:[];
  d.marks=Array.isArray(d.marks)?d.marks:[];
  d.markDays=(d.markDays&&typeof d.markDays==='object')?d.markDays:{};
  d.tasks=Array.isArray(d.tasks)?d.tasks:[];
  d.balances=Array.isArray(d.balances)?d.balances:[];
  d.balanceLog=Array.isArray(d.balanceLog)?d.balanceLog:[];
  for(const b of d.balances){ if(b.icon==null) b.icon=''; if(b.archived==null) b.archived=false;
    b.a=Object.assign({label:'A'},b.a||{}); b.b=Object.assign({label:'B'},b.b||{}); }
  d.settings=Object.assign({backupMode:'auto',theme:'system',granularity:5},d.settings||{});
  for(const c of d.categories){ if(c.icon==null) c.icon=''; if(c.archived==null) c.archived=false; }
  d.meta=Object.assign({created:Date.now(),updated:0,lastBackup:0,lastBackupUpdated:0},d.meta||{});
  if(d.schema<2){ // v2: autoBackup (sí/no) pasa a backupMode (auto/ask/off)
    if('autoBackup' in d.settings){ d.settings.backupMode=d.settings.autoBackup===false?'off':'auto'; delete d.settings.autoBackup; }
    d.schema=2; }
  if(!['auto','ask','off'].includes(d.settings.backupMode)) d.settings.backupMode='auto';
  if(d.schema<3){ d.schema=3; } // v3: marcas (eventos sí/no) y tareas; campos nuevos, nada que convertir
  if(d.schema<4){ d.schema=4; } // v4: balanzas (ocasiones de dos salidas); campos nuevos, nada que convertir
  // futuras versiones: if(d.schema<5){ ... d.schema=5; }
  d.schema=SCHEMA;
  return d;
}
let data, loadError=null;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return defaultData();
    return migrate(JSON.parse(raw));
  }catch(e){
    loadError=e;
    for(const k of snapshotKeys()){ try{return migrate(JSON.parse(localStorage.getItem(k)));}catch(_){} }
    try{const prev=localStorage.getItem(KEY_PREV); if(prev) return migrate(JSON.parse(prev));}catch(_){}
    return defaultData();
  }
}
function save(){
  data.meta.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(data));}
  catch(e){toast('No se pudo guardar: '+e.message);}
}
function snapshotKeys(){ // más reciente primero
  const ks=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith(KEY_SNAP)) ks.push(k);}
  return ks.sort().reverse();
}
function snapshotDaily(){
  // Una vez al día guardamos una copia intacta de los datos antes de tocarlos; se conservan las últimas SNAP_DAYS.
  try{
    const k=KEY_SNAP+dayKey(Date.now());
    if(!localStorage.getItem(k)){const raw=localStorage.getItem(KEY); if(raw) localStorage.setItem(k,raw);}
    snapshotKeys().slice(SNAP_DAYS).forEach(x=>localStorage.removeItem(x));
  }catch(_){}
}
function trash(){
  try{const t=JSON.parse(localStorage.getItem(KEY_TRASH)||'null'); if(!t) return null;
    if(Date.now()-t.date>TRASH_DAYS*DAY){localStorage.removeItem(KEY_TRASH);return null;} return t;}catch(_){return null;}
}
data=load();

/* ============ Utilidades de tiempo ============ */
const pad=n=>String(n).padStart(2,'0');
function fmtTime(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDur(ms,long){
  const m=Math.round(ms/MIN), h=Math.floor(m/60), r=m%60;
  if(h>=24){const d=Math.floor(h/24);return `${d} d ${h%24} h`;}
  if(long) return h?`${h} h ${pad(r)} min`:`${r} min`;
  return h?`${h}h ${pad(r)}`:`${r} min`;
}
function fmtHours(ms){const h=ms/HOUR;return (h>=10?h.toFixed(0):h.toFixed(1)).replace('.',',')+' h';}
function fmtClock(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function dayStart(ms){const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function dayEnd(ms){const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const DOW=['dom','lun','mar','mié','jue','vie','sáb'], MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDayLong(ms){const d=new Date(ms);const s=`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;return s[0].toUpperCase()+s.slice(1);}
function roundMin(ms){return Math.floor(ms/MIN)*MIN;}
snapshotDaily(); // aquí y no antes: usa dayKey/pad, definidos en este bloque

/* ============ Modelo ============ */
const catById=id=>data.categories.find(c=>c.id===id)||{id,name:'(sin categoría)',color:'#9a9a9a',icon:''};
const activeCats=()=>data.categories.filter(c=>!c.archived);
const running=()=>data.entries.find(e=>e.end==null);
const endOf=e=>e.end==null?Date.now():e.end;
function sortEntries(){data.entries.sort((a,b)=>a.start-b.start);}
function entriesOfDay(ds){const de=ds+DAY+HOUR;return data.entries.filter(e=>e.start<de&&endOf(e)>ds);}
function segmentsOfDay(ds){
  const de=dayEnd(ds), len=de-ds;
  return entriesOfDay(ds).map(e=>{
    const s=Math.max(e.start,ds), en=Math.min(endOf(e),de);
    return en>s?{e,left:(s-ds)/len*100,width:(en-s)/len*100,ms:en-s}:null;
  }).filter(Boolean);
}
function prevEntry(e){let p=null;for(const x of data.entries){if(x!==e&&endOf(x)<=e.start&&(!p||endOf(x)>endOf(p)))p=x;}return p;}
function nextEntry(e){let n=null;for(const x of data.entries){if(x!==e&&x.start>=endOf(e)&&(!n||x.start<n.start))n=x;}return n;}

/* Acciones */
function startCategory(catId){
  const r=running(); let now=roundTo(Date.now());
  if(!r&&state.startFrom&&state.startFrom<=now){
    const from=state.startFrom; state.startFrom=null;
    data.entries.push({id:uid(),cat:catId,start:from,end:null}); sortEntries(); save(); render();
    toast('Empezado desde las '+fmtTime(from)); return;
  }
  state.startFrom=null; state.pendEnd=null;
  if(r){
    if(r.cat===catId){stopRunning();return;}
    // menos de medio paso en marcha: fue un error de categoría, no una actividad
    if(Date.now()-r.start<STEP()*MIN/2||now<=r.start){ r.cat=catId; save(); toast('Categoría corregida'); render(); return; }
    r.end=now;
  } else {
    // detenido hace menos de un paso: se empalma con el fin del anterior
    const last=[...data.entries].filter(e=>e.end!=null).sort((a,b)=>b.end-a.end)[0];
    if(last&&last.end<=now){
      const since=Date.now()-last.end;
      // misma categoría poco después: la pregunta es si unir los dos, no desde cuándo empezar
      if(last.cat===catId&&since<RESUME_WINDOW){ state.resume={id:last.id,cat:catId,now}; state.sheet='resume'; renderSheet(); return; }
      if(since<STEP()*MIN){ now=last.end; toast('Empalmado con el anterior ('+fmtTime(last.end)+')'); }
    }
  }
  data.entries.push({id:uid(),cat:catId,start:now,end:null});
  sortEntries(); save(); render();
}
/* Hora de fin en edición: mientras se ajusta queda congelada, sin cerrar la actividad. */
function pendEnd(){ return state.pendEnd!=null?state.pendEnd:roundTo(Date.now()); }
function setPendEnd(ms){
  const r=running(); if(!r) return;
  if(ms<=r.start){toast('El fin tiene que ir después del inicio');render();return;}
  if(ms>roundTo(Date.now())){toast('El fin no puede ser futuro');render();return;}
  state.pendEnd=ms===roundTo(Date.now())?null:ms; render();
}
function stopRunningAt(ms){
  const r=running(); if(!r) return;
  if(ms<=r.start){toast('El fin tiene que ir después del inicio');render();return;}
  if(ms>roundTo(Date.now())){toast('El fin no puede ser futuro');render();return;}
  r.end=ms; const m=resolveOverlaps(r); if(m) toast(m);
  state.pendEnd=null; save(); render(); toast('Finalizada a las '+fmtTime(ms));
}
function stopRunning(){const r=running(); if(!r) return; state.pendEnd=null; r.end=roundTo(Date.now()); if(r.end<=r.start){data.entries=data.entries.filter(e=>e!==r);toast('Registro descartado: duraba menos de '+STEP()+' min');} save(); render();}
/* Recorta los registros vecinos para que no se solapen con `e`.
   Si un vecino queda sin duración, se elimina. Devuelve un texto para avisar. */
function resolveOverlaps(e){
  const en=endOf(e); let msg=[];
  for(const x of [...data.entries]){
    if(x===e) continue;
    const xe=endOf(x);
    if(xe<=e.start||x.start>=en) continue;            // sin solape
    if(x.start<e.start&&xe>e.start){ x.end=e.start; }   // anterior: se acorta por el final
    else if(x.start<en&&xe>en){ x.start=en; }              // siguiente (aunque esté en marcha): empieza más tarde
    else if(x.end!=null){ data.entries=data.entries.filter(y=>y!==x); msg.push('eliminado '+catById(x.cat).name); continue; } // cubierto del todo
    if(x.end!=null&&x.end<=x.start){ data.entries=data.entries.filter(y=>y!==x); msg.push('eliminado '+catById(x.cat).name); }
    else msg.push('ajustado '+catById(x.cat).name);
  }
  return msg.length?'Registro anterior '+msg.join(', '):'';
}
function deleteEntry(id){data.entries=data.entries.filter(e=>e.id!==id);save();}
/* Texto con lo que pasará a los demás registros al guardar `ed`: se simula el guardado sobre una copia. */
function overlapPreview(ed){
  const en=ed.end==null?Date.now():ed.end; if(en-ed.start<MIN) return '';
  const real=data.entries; let out=[];
  try{
    data.entries=JSON.parse(JSON.stringify(real));
    let target=ed.id?data.entries.find(x=>x.id===ed.id):null;
    if(target){target.cat=ed.cat;target.start=ed.start;target.end=ed.end;} else {target={id:'__preview',cat:ed.cat,start:ed.start,end:ed.end};data.entries.push(target);}
    jointFill(ed,target,true); resolveOverlaps(target);
    for(const x of real){
      if(x.id===ed.id) continue;
      const y=data.entries.find(z=>z.id===x.id), name=catById(x.cat).name;
      if(!y){out.push('se elimina '+name+' ('+fmtTime(x.start)+'–'+fmtTime(endOf(x))+')');continue;}
      const d=(endOf(y)-y.start)-(endOf(x)-x.start);
      if(Math.abs(d)>=MIN) out.push(name+' '+(d<0?'−':'+')+fmtDur(Math.abs(d)));
    }
  }catch(_){ out=[]; }
  data.entries=real;
  return out.join(', ');
}

/* ============ Copias de seguridad y exportación ============ */
async function saveFile(filename,text){
  const blob=new Blob([text],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}
function exportJSON(){return JSON.stringify(Object.assign({},data,{exported:new Date().toISOString(),app:'Registrador'}),null,1);}
function exportCSV(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=['fecha,inicio,fin,categoria,minutos,id,descanso'];
  for(const e of [...data.entries].sort((a,b)=>a.start-b.start)){
    const en=endOf(e);
    lines.push([dayKey(e.start),new Date(e.start).toISOString(),e.end==null?'':new Date(e.end).toISOString(),q(catById(e.cat).name),Math.round((en-e.start)/MIN),e.id,isRest(e.start)?1:0].join(','));
  }
  return lines.join('\n');
}
function backupName(ext){const d=new Date();return 'registrador-'+dayKey(d)+'-'+pad(d.getHours())+pad(d.getMinutes())+ext;}
function markBackup(){data.meta.lastBackup=Date.now();data.meta.lastBackupUpdated=data.meta.updated;save();}
async function doBackup(auto){
  const ok=await saveFile(backupName('.json'),exportJSON());
  if(ok){markBackup();toast(auto?'Copia diaria guardada en Descargas':'Copia guardada');render();}
  return ok;
}
async function shareBackup(){
  let file; try{file=new File([exportJSON()],backupName('.json'),{type:'application/json'});}catch(_){}
  if(!file||!navigator.canShare||!navigator.canShare({files:[file]})){toast('Este navegador no permite compartir archivos');return;}
  try{await navigator.share({files:[file],title:'Copia de Registrador'}); markBackup(); toast('Copia compartida'); render();}
  catch(e){ if(e&&e.name!=='AbortError') toast('No se pudo compartir: '+(e.message||e)); }
}
function backupPending(){
  return data.settings.backupMode!=='off' && data.entries.length>0 && data.meta.updated>data.meta.lastBackupUpdated && (Date.now()-data.meta.lastBackup>20*HOUR);
}
function autoBackupIfDue(){ if(data.settings.backupMode==='auto'&&backupPending()&&!state.sheet) doBackup(true); }
/* Borrado de registros con red de seguridad: copia descargada + papelera interna. */
function wipeEntries(){
  try{localStorage.setItem(KEY_TRASH,JSON.stringify({date:Date.now(),entries:data.entries,restDays:data.restDays,markDays:data.markDays,balanceLog:data.balanceLog}));}
  catch(e){toast('No se pudo guardar la papelera: '+e.message);return false;}
  data.entries=[]; data.restDays=[]; data.markDays={}; data.balanceLog=[]; save(); return true;
}
function undoWipe(){
  const t=trash(); if(!t){toast('La papelera está vacía');return;}
  const ids=new Set(data.entries.map(e=>e.id)); let n=0;
  for(const e of t.entries) if(!ids.has(e.id)){data.entries.push(e);n++;}
  for(const k of t.restDays||[]) if(!data.restDays.includes(k)) data.restDays.push(k);
  for(const k of Object.keys(t.markDays||{})) if(!data.markDays[k]) data.markDays[k]=t.markDays[k];
  {const bids=new Set(data.balanceLog.map(x=>x.id)); for(const x of t.balanceLog||[]) if(!bids.has(x.id)) data.balanceLog.push(x);}
  sortEntries(); save(); localStorage.removeItem(KEY_TRASH); render(); toast('Recuperados '+n+' registros');
}
function nukeEverything(){
  // Elimina todo lo que la app ha escrito en este navegador: datos, copias internas, papelera y ajustes.
  const ks=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('registrador.')) ks.push(k);}
  ks.forEach(k=>localStorage.removeItem(k));
  try{sessionStorage.clear();}catch(_){}
  location.reload();
}
function importJSON(text,mode){
  let d; try{d=migrate(JSON.parse(text));}catch(e){toast('El archivo no es una copia válida');return;}
  if(mode==='replace'){data=d;}
  else{
    const cats=new Map(data.categories.map(c=>[c.id,c])); for(const c of d.categories) if(!cats.has(c.id)) data.categories.push(c);
    const ids=new Map(data.entries.map(e=>[e.id,e]));
    let n=0; for(const e of d.entries){ if(!ids.has(e.id)){data.entries.push(e);n++;} }
    for(const k of d.restDays) if(!data.restDays.includes(k)) data.restDays.push(k);
    const bals=new Set(data.balances.map(b=>b.id)); for(const b of d.balances) if(!bals.has(b.id)) data.balances.push(b);
    const blog=new Set(data.balanceLog.map(x=>x.id)); for(const x of d.balanceLog) if(!blog.has(x.id)) data.balanceLog.push(x);
    toast(`${n} registros añadidos`);
  }
  sortEntries(); save(); render();
}

function entriesListHTML(ds,withGaps){
  const list=entriesOfDay(ds).filter(e=>endOf(e)>e.start).sort((a,b)=>b.start-a.start);
  if(!list.length) return `<p class="empty">Todavía no hay registros este día.</p>`;
  let html='';
  list.forEach((e,i)=>{
    const c=catById(e.cat);
    html+=`<button class="entry" data-edit="${e.id}"><span class="stripe" style="background:${c.color}"></span>
      <span class="times num">${fmtTime(e.start)}–${e.end==null?'…':fmtTime(e.end)}</span>
      <span class="cat">${c.icon?c.icon+' ':''}${esc(c.name)}</span><span class="dur num">${fmtDur(endOf(e)-e.start)}</span></button>`;
    const older=list[i+1];
    if(withGaps&&older&&e.start-endOf(older)>=5*MIN){
      html+=`<button class="entry gap" data-gap-start="${endOf(older)}" data-gap-end="${e.start}"><span></span><span class="times num">${fmtTime(endOf(older))}–${fmtTime(e.start)}</span><span class="cat">sin registrar · toca para rellenar</span><span class="dur num">${fmtDur(e.start-endOf(older))}</span></button>`;

  });

function isRest(ds){return data.restDays.includes(dayKey(ds));}
function toggleRest(ds){const k=dayKey(ds);if(isRest(ds))data.restDays=data.restDays.filter(x=>x!==k);else data.restDays.push(k);save();}

/* Huecos entre registros de un día (y, si es hoy y no hay nada en marcha, desde el último hasta ahora).
   En días de descanso no se cuenta. No forma parte del total registrado. */
function unassignedOfDay(ds){
  if(isRest(ds)) return 0;
  const de=dayEnd(ds), segs=entriesOfDay(ds).map(e=>[Math.max(e.start,ds),Math.min(endOf(e),de)]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  if(!segs.length) return 0;
  let u=0, cur=segs[0][1];
  for(const [a,b] of segs.slice(1)){ if(a>cur) u+=a-cur; if(b>cur) cur=b; }
  if(dayKey(ds)===dayKey(Date.now())&&!running()){ const now=Date.now(); if(now>cur) u+=now-cur; }
  return u;
}
function unassignedRowHTML(u,sum){
  if(!u||!sum) return '';
  return `<div class="trow unassigned"><span class="n"><i class="dot hollow"></i>Sin registrar</span><span class="v num">${fmtDur(u)} · +${Math.round(u/sum*100)} %</span><span class="sub">Huecos entre registros. Va aparte del 100 %.</span></div>`;
}
function dayTotalsHTML(ds){
  const tot=todayTotals(ds); let total=0; tot.forEach(v=>total+=v);
  if(!total) return '';
  const rows=[...tot.entries()].map(([id,ms])=>({c:catById(id),ms})).sort((a,b)=>b.ms-a.ms), u=unassignedOfDay(ds);
  return `<div class="daytot"><span><b class="num">${fmtDur(total)}</b> en total</span>${rows.map(r=>`<span><i class="dot" style="background:${r.c.color}"></i>${esc(r.c.name)} <b class="num">${fmtDur(r.ms)}</b><span class="pct num">${Math.round(r.ms/total*100)} %</span></span>`).join('')}${u?`<span class="un">sin registrar <b class="num">${fmtDur(u)}</b><span class="pct num">+${Math.round(u/total*100)} %</span></span>`:''}</div>`;
}
function todayTotals(ds){const m=new Map();for(const s of segmentsOfDay(ds)) m.set(s.e.cat,(m.get(s.e.cat)||0)+s.ms);return m;}

/* ============ Marcas (eventos de sí/no) ============
   Una marca es solo eso: hoy sí o hoy no. Sin horas ni duración, para no confundirlas
   con las categorías. Se guardan por día en data.markDays. */
function activeMarks(){return data.marks.filter(m=>!m.archived);}
function markById(id){return data.marks.find(m=>m.id===id)||{name:'?',color:'#888',icon:''};}
function isMarked(id,ds){return (data.markDays[dayKey(ds)]||[]).includes(id);}
function toggleMark(id,ds){
  const k=dayKey(ds), list=data.markDays[k]||[];
  if(list.includes(id)){const r=list.filter(x=>x!==id); if(r.length) data.markDays[k]=r; else delete data.markDays[k];}
  else data.markDays[k]=list.concat(id);
  save();
}
function marksRowHTML(ds){
  const ms=activeMarks(); if(!ms.length) return '';
  return `<div class="marks">${ms.map(m=>`<button class="markchip ${isMarked(m.id,ds)?'on':''}" data-mark="${m.id}" data-markday="${ds}" aria-pressed="${isMarked(m.id,ds)}" style="--mc:${m.color}">${m.icon?m.icon+' ':''}${esc(m.name)}</button>`).join('')}</div>`;
}
function markStreak(id){ // días seguidos marcados terminando hoy (o ayer, si hoy aún no)
  let d=dayStart(Date.now()), n=0;
  if(!isMarked(id,d)) d-=DAY;
  while(isMarked(id,dayStart(d+HOUR*12))){n++;d-=DAY;}
  return n;
}
function statsMarksHTML(days){

/* ============ Balanzas (ocasiones de dos salidas) ============
   Una balanza no es una actividad, es una ocasión que se presenta y se resuelve de una de dos
   maneras («me lo callé» / «lo dije»). Cada toque queda en data.balanceLog con su hora, así se
   puede deshacer el último, apuntar en un día pasado y, más adelante, mirar a qué hora pasa.
   A propósito no hay rachas ni colores de aprobado: lo que se mira es el reparto y, sobre todo,
   cuántas ocasiones hubo. */
function activeBalances(){return data.balances.filter(b=>!b.archived);}
function balById(id){return data.balances.find(b=>b.id===id)||{id,name:'?',color:'#888',icon:'',a:{label:'A'},b:{label:'B'}};}
function balOfDay(id,ds,side){
  const a=dayStart(ds), z=a+DAY;
  return data.balanceLog.filter(x=>x.bid===id&&x.t>=a&&x.t<z&&(!side||x.side===side)).length;
}
function balOfDays(id,list,side){let n=0;for(const ds of list)n+=balOfDay(id,ds,side);return n;}
function addBalance(id,side,ds){
  // En un día pasado no hay hora real que apuntar: se anota a mediodía de ese día.
  const t = dayStart(ds)===dayStart(Date.now()) ? Date.now() : dayStart(ds)+12*HOUR;
  data.balanceLog.push({id:uid(),bid:id,side,t}); save();
}
function undoBalance(id,ds){
  const a=dayStart(ds), z=a+DAY; let best=-1;
  data.balanceLog.forEach((x,i)=>{ if(x.bid===id&&x.t>=a&&x.t<z&&(best<0||x.t>=data.balanceLog[best].t)) best=i; });
  if(best<0) return false;
  data.balanceLog.splice(best,1); save(); return true;
}
function balanceRowHTML(b,ds){
  const na=balOfDay(b.id,ds,'a'), nb=balOfDay(b.id,ds,'b'), tot=na+nb;
  const side=(k,n,color)=>`<button class="balbtn ${n?'has':''}" data-bal="${b.id}" data-side="${k}" data-balday="${ds}" style="--bc:${color}"><span>${esc(b[k].label)}</span><b class="num">${n}</b></button>`;
  return `<div class="balance">
    <div class="balhead"><span>${b.icon?b.icon+' ':''}${esc(b.name)}</span><small>${tot?`${tot} ${tot===1?'ocasión':'ocasiones'}`:'sin ocasiones apuntadas'}</small></div>
    <div class="balsides">${side('a',na,b.color)}${side('b',nb,'var(--ink-3)')}${tot?`<button class="balundo" data-balundo="${b.id}" data-balday="${ds}" aria-label="Deshacer el último">↺</button>`:''}</div>
  </div>`;
}
function balancesHTML(ds){
  const bs=activeBalances(); if(!bs.length) return '';
  return `<div class="balances">${bs.map(b=>balanceRowHTML(b,ds)).join('')}</div>`;
}
function statsBalancesHTML(days,prevDays){
  const bs=activeBalances(); if(!bs.length) return '';
  const rows=bs.map(b=>{
    const na=balOfDays(b.id,days,'a'), nb=balOfDays(b.id,days,'b'), tot=na+nb;
    if(!tot) return `<div class="balance"><div class="balhead"><span>${b.icon?b.icon+' ':''}${esc(b.name)}</span><small>ninguna ocasión en el periodo</small></div></div>`;
    const pa=balOfDays(b.id,prevDays,'a'), pb=balOfDays(b.id,prevDays,'b'), ptot=pa+pb;
    const pc=Math.round(na/tot*100), ppc=ptot?Math.round(pa/ptot*100):null;
    const antes = ptot ? (Math.abs(pc-ppc)<5 ? ` Antes salía parecido (${ppc} %, ${ptot} ${ptot===1?'ocasión':'ocasiones'}).` : ` Antes era ${ppc} % de ${ptot} ${ptot===1?'ocasión':'ocasiones'}.`) : '';
    return `<div class="balance">
      <div class="balhead"><span>${b.icon?b.icon+' ':''}${esc(b.name)}</span><small>${tot} ${tot===1?'ocasión':'ocasiones'}</small></div>
      <div class="balbar"><i style="width:${na/tot*100}%;background:${b.color}"></i><i style="width:${nb/tot*100}%;background:var(--ink-3)"></i></div>
      <div class="sub" style="font-size:12px;color:var(--ink-2)"><span class="num">${na}</span> ${esc(b.a.label)} · <span class="num">${nb}</span> ${esc(b.b.label)} — ${pc} % del primer lado.${antes}</div>
    </div>`;
  }).join('');
  return `<section class="card"><div class="section-head"><h2>Balanzas</h2><span class="label">${days.length} días</span></div>
    <div class="balances" style="margin-top:4px">${rows}</div></section>`;
}

/* ============ Tareas ============
   Recordatorios sueltos colgados de una categoría. Ni fechas ni prioridades: si hace falta
   más que esto, la herramienta correcta es otra aplicación. */
function taskGroups(){
  const byCat=new Map();
  for(const t of data.tasks){ if(!byCat.has(t.cat)) byCat.set(t.cat,[]); byCat.get(t.cat).push(t); }
  const order=data.categories.map(c=>c.id).filter(id=>byCat.has(id));
  for(const id of byCat.keys()) if(!order.includes(id)) order.push(id);
  return order.map(id=>({c:catById(id),list:byCat.get(id).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||b.created-a.created)}));
}
function viewTareas(){
  const groups=taskGroups(), doneN=data.tasks.filter(t=>t.done).length;

    ${groups.length?groups.map(g=>{

        ${closed?'':`<div class="tasks">${g.list.map(t=>`<div class="task ${t.done?'done':''}">

/* Registros: navegar por los días y editarlos. Las estadísticas viven aparte. */

/* Estadísticas: solo días completos (hoy va a medias y falsearía medias y comparaciones). */
function periodTotals(list){
  const m=new Map(); let s=0;
  for(const ds of list) for(const g of segmentsOfDay(ds)){ m.set(g.e.cat,(m.get(g.e.cat)||0)+g.ms); s+=g.ms; }
  return {m,s};
}
function deltaHTML(now,before){
  if(!before) return '';
  const d=now-before; if(Math.abs(d)<10*MIN) return `<span class="delta flat">≈ igual</span>`;
  return `<span class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${fmtDur(Math.abs(d))}</span>`;
}
/* Recorte de un registro a una ventana [a,b); null si no la toca. */
function clipEntry(e,a,b){const s=Math.max(e.start,a),en=Math.min(endOf(e),b);return en>s?[s,en]:null;}
/* Reparto por hora del día (0–23) de todos los días dados. Ninguna categoría está
   escrita a mano: se recorren las que aparezcan en los registros. */
function hourMatrix(days){
  const hours=Array.from({length:24},()=>({m:new Map(),t:0}));
  for(const ds of days) for(const e of entriesOfDay(ds)) for(let h=0;h<24;h++){
    const a=ds+h*HOUR, c=clipEntry(e,a,a+HOUR); if(!c) continue;
    const cell=hours[h], ms=c[1]-c[0];
    cell.m.set(e.cat,(cell.m.get(e.cat)||0)+ms); cell.t+=ms;
  }
  return hours;
}
/* Barra vertical apilada: se ordenan las categorías como en Ajustes para que el
   apilado sea estable de una columna a otra. */
function stackHTML(map,full,height){
  const order=data.categories.map(c=>c.id).filter(id=>map.has(id));
  return `<div class="vbar"><div class="vstack" style="height:${Math.min(100,height*100)}%">${
    order.map(id=>`<i style="flex:${map.get(id)} 1 0;background:${catById(id).color}"></i>`).join('')}</div></div>`;
}
function legendHTML(ids){
  return `<div class="legend" style="margin-top:10px">${data.categories.filter(c=>ids.has(c.id)).map(c=>`<span><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span>`).join('')}</div>`;
}
function weekStart(ms){const d=new Date(ms);const wd=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd).getTime();}
function statCat(){
  if(state.statCat&&data.categories.some(c=>c.id===state.statCat)) return state.statCat;
  const m=new Map();
  for(let i=1;i<=90;i++) for(const g of segmentsOfDay(dayStart(dayStart(Date.now())-i*DAY+HOUR*12))) m.set(g.e.cat,(m.get(g.e.cat)||0)+g.ms);
  const top=[...m.entries()].sort((a,b)=>b[1]-a[1])[0];
  return top?top[0]:(activeCats()[0]||{}).id;
}

function statsResumen(statDays,n){
  const prevDays=[]; for(let i=n+1;i<=2*n;i++) prevDays.push(dayStart(dayStart(Date.now())-i*DAY+HOUR*12));
  const cur=periodTotals(statDays), prev=periodTotals(prevDays);
  const rows=[...cur.m.entries()].map(([id,ms])=>({c:catById(id),ms,prev:prev.m.get(id)||0})).sort((a,b)=>b.ms-a.ms);
  const max=rows.length?rows[0].ms:1;
  const workDays=statDays.filter(ds=>!isRest(ds)&&segmentsOfDay(ds).length);
  const restCount=statDays.filter(isRest).length;
  let workSum=0;for(const ds of workDays)for(const g of segmentsOfDay(ds))workSum+=g.ms;
  const perCat=(id,list)=>{let w=0;for(const ds of list)for(const g of segmentsOfDay(ds))if(g.e.cat===id)w+=g.ms;return w;};
  return `<section class="card">
      <div class="section-head"><h2>Por categoría</h2><span class="sub num" style="font-size:12px;color:var(--ink-2)">${fmtDur(cur.s)} en total</span></div>
      <div class="totals" style="margin-top:12px">${rows.length?rows.map(r=>`<div class="trow">
        <span class="n"><i class="dot" style="background:${r.c.color}"></i>${esc(r.c.name)}</span>
        <span class="v num">${fmtDur(r.ms)} · ${Math.round(r.ms/cur.s*100)} %</span>
        <span class="bar"><i style="width:${r.ms/max*100}%;background:${r.c.color}"></i></span>
        <span class="sub num">${workDays.length&&perCat(r.c.id,workDays)?`media ${fmtDur(perCat(r.c.id,workDays)/workDays.length)} por día`:'solo en días de descanso'}${prev.s?' · ':''}${prev.s?deltaHTML(r.ms,r.prev):''}</span></div>`).join('')+unassignedRowHTML(statDays.reduce((a,ds)=>a+unassignedOfDay(ds),0),cur.s):'<p class="empty">Sin registros en este periodo.</p>'}
      ${restCount?`<p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:12px">🌴 ${restCount} ${restCount===1?'día de descanso':'días de descanso'}, con ${fmtDur(cur.s-workSum)} registradas. Las medias se calculan sobre los ${workDays.length} días restantes con registros.</p>`:''}
      ${prev.s?`<p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:8px">▲▼ comparado con los ${n} días anteriores (${fmtDur(prev.s)} en total).</p>`:''}</div>
    </section>
    ${statsMarksHTML(statDays)}
    ${statsBalancesHTML(statDays,prevDays)}
    <section class="card">
      <div class="section-head"><h2>Día a día</h2><span class="label">toca para editarlo</span></div>
      <div class="dayrows" style="margin-top:10px">${statDays.slice().reverse().map(ds=>{
        let t=0;for(const g of segmentsOfDay(ds))t+=g.ms;const d=new Date(ds);
        return `<button class="dayrow ${isRest(ds)?'rest':''}" data-day="${ds}" data-goto="registros"><span class="d">${DOW[d.getDay()]}<small>${d.getDate()} ${MON[d.getMonth()]}</small></span><span>${dayBarHTML(ds,{small:true,ticks:false,static:true})}</span><span class="h num">${t?fmtHours(t):'—'}</span></button>`;}).join('')}</div>
    </section>`;
}

/* Día tipo: a qué hora sueles hacer cada cosa. La altura de cada columna es la parte
   de esa hora que llegas a tener registrada; el hueco de arriba es lo no registrado. */
function statsDiaTipo(statDays){
  const hours=hourMatrix(statDays), used=new Set();
  for(const h of hours) for(const id of h.m.keys()) used.add(id);
  if(!used.size) return '<p class="empty">Sin registros en este periodo.</p>';
  const n=statDays.length;
  const top=hours.map(h=>{const e=[...h.m.entries()].sort((a,b)=>b[1]-a[1])[0];return e?catById(e[0]).name:null;});
  return `<section class="card">
    <div class="section-head"><h2>Día tipo</h2><span class="label">${n} días</span></div>
    <div class="hourbars">${hours.map((h,i)=>`<div class="hcol" title="${pad(i)}:00 · ${top[i]?esc(top[i]):'sin registrar'}">${stackHTML(h.m,1,h.t/(n*HOUR))}</div>`).join('')}</div>
    <div class="ticks cols"><span style="grid-column:1">0</span><span style="grid-column:4">3</span><span style="grid-column:7">6</span><span style="grid-column:10">9</span><span style="grid-column:13">12</span><span style="grid-column:16">15</span><span style="grid-column:19">18</span><span style="grid-column:22">21</span></div>
    ${legendHTML(used)}
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:10px">Cada columna es una hora del día. Lo que le falta para llegar arriba es tiempo sin registrar.</p>
  </section>`;
}

/* Semana: media de cada día de la semana. Los días de descanso no cuentan. */
function statsSemana(statDays){
  const dows=Array.from({length:7},()=>({m:new Map(),t:0,n:0}));
  for(const ds of statDays){
    if(isRest(ds)) continue;
    const i=(new Date(ds).getDay()+6)%7, cell=dows[i]; cell.n++;
    for(const g of segmentsOfDay(ds)){ cell.m.set(g.e.cat,(cell.m.get(g.e.cat)||0)+g.ms); cell.t+=g.ms; }
  }
  const used=new Set(); for(const c of dows) for(const id of c.m.keys()) used.add(id);
  if(!used.size) return '<p class="empty">Sin registros en este periodo.</p>';
  const avg=dows.map(c=>c.n?c.t/c.n:0), max=Math.max(...avg,1);
  const names=['L','M','X','J','V','S','D'];
  return `<section class="card">
    <div class="section-head"><h2>Por día de la semana</h2><span class="label">media por día</span></div>
    <div class="dowbars">${dows.map((c,i)=>`<div class="dcol">
      ${stackHTML(c.m,1,avg[i]/max)}
      <span class="dlab">${names[i]}</span><span class="dval num">${c.n?fmtHours(avg[i]):'—'}</span></div>`).join('')}</div>
    ${legendHTML(used)}
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:10px">Media de los ${dows.reduce((a,c)=>a+c.n,0)} días del periodo que no son de descanso.</p>
  </section>`;
}

/* Progresión: una barra por semana, la unidad que perdona los días malos.
   Sin metas, sin rachas y sin colores de aprobado o suspenso: solo la forma del último medio año. */
function statsProgresion(){
  const id=statCat(), c=catById(id), W=state.weeks, cw=weekStart(Date.now());
  const weeks=[];
  for(let i=W;i>=1;i--){
    const d=new Date(cw), ws=new Date(d.getFullYear(),d.getMonth(),d.getDate()-7*i).getTime();
    let ms=0;
    for(let k=0;k<7;k++){ const ds=dayStart(ws+k*DAY+HOUR*12); for(const g of segmentsOfDay(ds)) if(g.e.cat===id) ms+=g.ms; }
    weeks.push({ws,ms});
  }
  const avg4=weeks.map((_,i)=>{const a=weeks.slice(Math.max(0,i-3),i+1);return a.reduce((x,w)=>x+w.ms,0)/a.length;});
  const max=Math.max(...weeks.map(w=>w.ms),HOUR);
  const last4=weeks.slice(-4).reduce((a,w)=>a+w.ms,0)/4, prev4=weeks.slice(-8,-4).reduce((a,w)=>a+w.ms,0)/Math.max(1,weeks.slice(-8,-4).length);
  const VW=320, VH=110, bw=VW/weeks.length, y=ms=>VH-ms/max*(VH-8);
  const pts=avg4.map((m,i)=>`${(i*bw+bw/2).toFixed(1)},${y(m).toFixed(1)}`).join(' ');
  const mm=new Date(weeks[0].ws), mm2=new Date(weeks[weeks.length-1].ws);
  return `<section class="card">
    <div class="section-head"><h2>${esc(c.name)}, semana a semana</h2><span class="label">${fmtHours(max)} máx.</span></div>
    <svg class="weeksvg" viewBox="0 0 ${VW} ${VH+2}" preserveAspectRatio="none" role="img" aria-label="Horas por semana">
      ${weeks.map((w,i)=>`<rect x="${(i*bw+bw*0.12).toFixed(1)}" y="${y(w.ms).toFixed(1)}" width="${(bw*0.76).toFixed(1)}" height="${(VH-y(w.ms)).toFixed(1)}" fill="${c.color}" opacity=".35"></rect>`).join('')}
      <polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
      <line x1="0" y1="${VH}" x2="${VW}" y2="${VH}" stroke="currentColor" opacity=".15"></line>
    </svg>
    <div class="ticks"><span>${MON[mm.getMonth()]}</span><span>${MON[mm2.getMonth()]}</span></div>
    <p style="margin:10px 0 0;font-size:14px;color:var(--ink-2)">Últimas 4 semanas: <strong class="num">${fmtDur(last4)}</strong> de media a la semana.${prev4?` Las 4 anteriores: <strong class="num">${fmtDur(prev4)}</strong>.`:''}</p>
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:8px">La línea es la media de cuatro semanas. La semana en curso no aparece hasta que termina.</p>
  </section>`;
}

/* ============ Tipos de día ============
   Agrupa los días del periodo por CÓMO repartes el tiempo, no por cuánto registras:
   cada día es un vector de proporciones por categoría, así un día con menos horas
   apuntadas no se va a un grupo aparte solo por eso.
   k-medias con arranque k-medias++ y semilla fija (mismos datos, mismo resultado);
   el número de grupos se elige por silueta entre 2 y 4.
   Es descripción, no predicción: con pocos días no dice nada, de ahí el mínimo. */
const KCOLORS=['#7c3aed','#0f6e5e','#a87400','#b0306e'];
const KLETTERS=['A','B','C','D'];
const KMIN=12;
function dayVectors(days){
  const rows=[];
  for(const ds of days){
    if(isRest(ds)) continue;
    const m=new Map(); let t=0;
    for(const g of segmentsOfDay(ds)){ m.set(g.e.cat,(m.get(g.e.cat)||0)+g.ms); t+=g.ms; }
    if(t<2*HOUR) continue; // un día casi vacío no describe nada
    rows.push({ds,t,m});
  }
  const cats=data.categories.map(c=>c.id).filter(id=>rows.some(r=>(r.m.get(id)||0)>0));
  for(const r of rows) r.v=cats.map(id=>(r.m.get(id)||0)/r.t);
  return {cats,rows};
}
const dist2=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return s;};
function seeded(seed){return()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};}
function kmeans(V,k,seed){
  const rnd=seeded(seed), n=V.length;
  const cents=[V[Math.floor(rnd()*n)].slice()];
  while(cents.length<k){ // k-medias++: cada centro nuevo, lejos de los que ya hay
    const d=V.map(v=>Math.min(...cents.map(c=>dist2(v,c))));
    let acc=d.reduce((a,b)=>a+b,0)*rnd(), i=0;
    while(i<n-1&&(acc-=d[i])>0) i++;
    cents.push(V[i].slice());
  }
  const lab=new Array(n).fill(0);
  for(let it=0;it<25;it++){
    let moved=false;
    for(let i=0;i<n;i++){
      let best=0,bd=Infinity;
      for(let c=0;c<k;c++){const dd=dist2(V[i],cents[c]); if(dd<bd){bd=dd;best=c;}}
      if(lab[i]!==best){lab[i]=best;moved=true;}
    }
    for(let c=0;c<k;c++){
      const mem=V.filter((_,i)=>lab[i]===c); if(!mem.length) continue;
      cents[c]=cents[c].map((_,j)=>mem.reduce((a,v)=>a+v[j],0)/mem.length);
    }
    if(!moved&&it) break;
  }
  return {lab,cents,inertia:V.reduce((a,v,i)=>a+dist2(v,cents[lab[i]]),0)};
}
function silhouette(V,lab,k){ // −1 mal agrupado, 1 grupos claros
  const n=V.length; let sum=0, cnt=0;
  for(let i=0;i<n;i++){
    const d=Array.from({length:k},()=>[0,0]);
    for(let j=0;j<n;j++){ if(i===j) continue; const c=lab[j]; d[c][0]+=Math.sqrt(dist2(V[i],V[j])); d[c][1]++; }
    const own=d[lab[i]][1]?d[lab[i]][0]/d[lab[i]][1]:0;
    let other=Infinity;
    for(let c=0;c<k;c++) if(c!==lab[i]&&d[c][1]) other=Math.min(other,d[c][0]/d[c][1]);
    if(other===Infinity||Math.max(own,other)===0) continue;
    sum+=(other-own)/Math.max(own,other); cnt++;
  }
  return cnt?sum/cnt:0;
}
function bestClustering(V){
  let best=null;
  const kmax=Math.min(4,Math.floor(V.length/4));
  for(let k=2;k<=kmax;k++){
    let run=null;
    for(let s=1;s<=6;s++){ const r=kmeans(V,k,s*7919); if(!run||r.inertia<run.inertia) run=r; }
    const score=silhouette(V,run.lab,k);
    if(!best||score>best.score) best=Object.assign({k,score},run);
  }
  return best;
}
/* PCA a dos componentes por iteración de potencias sobre la covarianza.
   Solo sirve para colocar los días en un mapa; los ejes se explican con sus pesos. */
function pca2(V){
  const n=V.length, d=V[0].length;
  const mean=Array.from({length:d},(_,j)=>V.reduce((a,v)=>a+v[j],0)/n);
  const X=V.map(v=>v.map((x,j)=>x-mean[j]));
  const C=Array.from({length:d},()=>new Array(d).fill(0));
  for(const x of X) for(let i=0;i<d;i++) for(let j=0;j<d;j++) C[i][j]+=x[i]*x[j]/n;
  const mul=(M,v)=>M.map(r=>r.reduce((a,x,j)=>a+x*v[j],0));
  const norm=v=>{const m=Math.sqrt(v.reduce((a,x)=>a+x*x,0))||1;return v.map(x=>x/m);};
  const power=M=>{let v=norm(Array.from({length:d},(_,i)=>Math.sin(i+1)));for(let i=0;i<120;i++)v=norm(mul(M,v));return v;};
  const p1=power(C);
  const l1=mul(C,p1).reduce((a,x,i)=>a+x*p1[i],0);
  const p2=power(C.map((r,i)=>r.map((x,j)=>x-l1*p1[i]*p1[j])));
  const proj=p=>X.map(x=>x.reduce((a,q,j)=>a+q*p[j],0));
  return {p1,p2,x:proj(p1),y:proj(p2)};
}
function axisLabel(load,cats){
  const idx=load.map((w,i)=>[w,i]).sort((a,b)=>a[0]-b[0]);
  const lo=idx[0], hi=idx[idx.length-1];
  return `${esc(catById(cats[lo[1]]).name)} ← → ${esc(catById(cats[hi[1]]).name)}`;
}
function clusterName(cent,cats){
  const top=cent.map((w,i)=>({w,c:catById(cats[i])})).sort((a,b)=>b.w-a.w).filter(x=>x.w>=0.12).slice(0,3);
  return top.length?top.map(x=>`${esc(x.c.name)} ${Math.round(x.w*100)} %`).join(' · '):'repartido';
}
function statsTipos(days){
  const {cats,rows}=dayVectors(days);
  const head=`<div class="section-head"><h2>Tipos de día</h2><span class="label">${rows.length} días</span></div>`;
  if(cats.length<2||rows.length<KMIN)
    return `<section class="card">${head}<p class="empty">Hacen falta al menos ${KMIN} días con dos horas registradas (llevas ${rows.length} en este periodo) y dos categorías.</p>
      ${state.range<90?`<div class="row"><button class="btn sm" data-range="${state.range<30?30:90}">Probar con ${state.range<30?30:90} días</button></div>`:''}</section>`;
  const V=rows.map(r=>r.v), km=bestClustering(V);
  const groups=Array.from({length:km.k},(_,c)=>({c,days:rows.filter((_,i)=>km.lab[i]===c)}));
  const DOWL=['L','M','X','J','V','S','D'];
  const P=pca2(V);
  const xs=P.x, ys=P.y;
  const rng=a=>{const mn=Math.min(...a),mx=Math.max(...a);return [mn,(mx-mn)||1];};
  const [x0,xr]=rng(xs), [y0,yr]=rng(ys);
  const byDay=new Map(); rows.forEach((r,i)=>byDay.set(r.ds,km.lab[i]));
  const chrono=days.slice().reverse();
  return `<section class="card">${head}
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin:0">Agrupados por cómo repartes el tiempo, no por cuánto registras. ${km.score>=0.35?'Los grupos salen bien separados.':km.score>=0.2?'Los grupos se distinguen, pero con solapamiento.':'Ojo: tus días se parecen mucho entre sí, la división es endeble.'}</p>
    <div style="margin-top:10px">${groups.map(g=>{
      const cent=km.cents[g.c], n=g.days.length;
      const hrs=g.days.reduce((a,r)=>a+r.t,0)/Math.max(1,n);
      const dw=new Map(); for(const r of g.days){const i=(new Date(r.ds).getDay()+6)%7; dw.set(i,(dw.get(i)||0)+1);}
      const tops=[...dw.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).filter(e=>e[1]>1).map(e=>DOWL[e[0]]).join(' ');
      return `<div class="kcard"><span class="kdot" style="background:${KCOLORS[g.c]}"></span>
        <span class="grow"><strong>${KLETTERS[g.c]} · ${clusterName(cent,cats)}</strong><br>
        <span class="desc">${n} ${n===1?'día':'días'} · ${fmtDur(hrs)} registradas de media${tops?` · sobre todo ${tops}`:''}</span></span></div>`;}).join('')}</div>
    <div class="kstrip">${chrono.map(ds=>{
      const c=byDay.get(ds), d=new Date(ds);
      return `<button class="kcell ${c==null?'none':''}" data-day="${ds}" data-goto="registros" style="${c==null?'':`background:${KCOLORS[c]}`}" title="${fmtDayLong(ds)}">${c==null?(isRest(ds)?'🌴':'·'):KLETTERS[c]}</button>`;}).join('')}</div>
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:8px">Un cuadro por día, del más antiguo al más reciente. Los grises son días de descanso o con menos de dos horas registradas. Toca uno para abrirlo.</p>
  </section>
  <section class="card"><div class="section-head"><h2>Mapa de días</h2><span class="label">días parecidos, cerca</span></div>
    <svg class="mapsvg" viewBox="0 0 320 200" role="img" aria-label="Mapa de días">
      <line x1="0" y1="100" x2="320" y2="100" stroke="currentColor" opacity=".18"></line>
      <line x1="160" y1="0" x2="160" y2="200" stroke="currentColor" opacity=".18"></line>
      ${rows.map((r,i)=>`<circle cx="${(14+(xs[i]-x0)/xr*292).toFixed(1)}" cy="${(186-(ys[i]-y0)/yr*172).toFixed(1)}" r="5" fill="${KCOLORS[km.lab[i]]}" opacity=".75"></circle>`).join('')}
    </svg>
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:6px">Horizontal: ${axisLabel(P.p1,cats)}<br>Vertical: ${axisLabel(P.p2,cats)}</p>
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:8px">Cada punto es un día; los días parecidos caen juntos. Los ejes son las dos direcciones en las que tus días más se diferencian entre sí, no una medida de nada bueno ni malo.</p>
  </section>`;
}

/* ============ Huecos ============
   Los huecos entre registros no son solo ruido: dicen a qué hora se te escapa el
   registro y detrás de qué actividad. Se cuentan igual que en "Sin registrar":
   solo entre el primer y el último registro del día, y nunca en días de descanso. */
function gapsOfDay(ds){
  if(isRest(ds)) return [];
  const de=dayEnd(ds);
  const segs=entriesOfDay(ds).map(e=>({a:Math.max(e.start,ds),b:Math.min(endOf(e),de),cat:e.cat})).filter(x=>x.b>x.a).sort((p,q)=>p.a-q.a);
  if(!segs.length) return [];
  const out=[]; let cur=segs[0].b, curCat=segs[0].cat;
  for(const s of segs.slice(1)){
    if(s.a>cur) out.push({a:cur,b:s.a,after:curCat});
    if(s.b>cur){cur=s.b;curCat=s.cat;}
  }
  const now=Date.now();
  if(dayKey(ds)===dayKey(now)&&!running()&&now>cur) out.push({a:cur,b:now,after:curCat});
  return out;
}
const GAP_BANDS=[[0,15*MIN,'menos de 15 min'],[15*MIN,HOUR,'de 15 min a 1 h'],[HOUR,3*HOUR,'de 1 a 3 h'],[3*HOUR,Infinity,'más de 3 h']];
function statsHuecos(days){
  const gaps=[]; for(const ds of days) for(const g of gapsOfDay(ds)) gaps.push(g);
  const head=`<div class="section-head"><h2>Huecos</h2><span class="label">${days.length} días</span></div>`;
  if(!gaps.length) return `<section class="card">${head}<p class="empty">No hay huecos entre registros en este periodo. O lo apuntas todo, o hay pocos días con registros.</p></section>`;
  const total=gaps.reduce((a,g)=>a+(g.b-g.a),0);
  let reg=0; for(const ds of days) for(const sg of segmentsOfDay(ds)) reg+=sg.ms;
  const withGaps=days.filter(ds=>gapsOfDay(ds).length).length;
  // a qué hora caen
  const byHour=new Array(24).fill(0);
  for(const g of gaps) for(let h=0;h<24;h++){
    const ds=dayStart(g.a), a=ds+h*HOUR, s=Math.max(g.a,a), e=Math.min(g.b,a+HOUR);
    if(e>s) byHour[h]+=e-s;
  }
  const maxH=Math.max(...byHour,1);
  // detrás de qué categoría
  const after=new Map();
  for(const g of gaps){ const k=g.after; const v=after.get(k)||{n:0,ms:0}; v.n++; v.ms+=g.b-g.a; after.set(k,v); }
  const afterRows=[...after.entries()].map(([id,v])=>({c:catById(id),...v})).sort((a,b)=>b.ms-a.ms).slice(0,4);
  const bands=GAP_BANDS.map(([lo,hi,name])=>{const l=gaps.filter(g=>{const d=g.b-g.a;return d>=lo&&d<hi;});return {name,n:l.length,ms:l.reduce((a,g)=>a+(g.b-g.a),0)};}).filter(b=>b.n);
  const maxB=Math.max(...bands.map(b=>b.ms),1);
  return `<section class="card">${head}
    <p style="margin:0;font-size:14px;color:var(--ink-2)"><strong class="num">${fmtDur(total)}</strong> sin registrar en ${gaps.length} huecos, repartidos en ${withGaps} ${withGaps===1?'día':'días'}. Es un <strong class="num">+${Math.round(total/Math.max(1,reg)*100)} %</strong> sobre lo registrado.</p>
    <div class="section-head" style="margin-top:16px"><h2>A qué hora se escapan</h2></div>
    <div class="hourbars">${byHour.map((ms,i)=>`<div class="hcol" title="${pad(i)}:00 · ${fmtDur(ms)}"><div class="vbar"><div class="vstack" style="height:${ms/maxH*100}%"><i style="flex:1 1 0;background:var(--ink-3)"></i></div></div></div>`).join('')}</div>
    <div class="ticks cols"><span style="grid-column:1">0</span><span style="grid-column:4">3</span><span style="grid-column:7">6</span><span style="grid-column:10">9</span><span style="grid-column:13">12</span><span style="grid-column:16">15</span><span style="grid-column:19">18</span><span style="grid-column:22">21</span></div>
    <div class="section-head" style="margin-top:16px"><h2>Detrás de qué actividad</h2></div>
    <div class="totals" style="margin-top:10px">${afterRows.map(r=>`<div class="trow">
      <span class="n"><i class="dot" style="background:${r.c.color}"></i>${esc(r.c.name)}</span>
      <span class="v num">${fmtDur(r.ms)} · ${r.n} ${r.n===1?'hueco':'huecos'}</span>
      <span class="bar"><i style="width:${r.ms/afterRows[0].ms*100}%;background:${r.c.color}"></i></span>
      <span class="sub num">media ${fmtDur(r.ms/r.n)} por hueco</span></div>`).join('')}</div>
    <div class="section-head" style="margin-top:16px"><h2>Cómo de largos</h2></div>
    <div class="totals" style="margin-top:10px">${bands.map(b=>`<div class="trow">
      <span class="n">${b.name}</span><span class="v num">${b.n} · ${fmtDur(b.ms)}</span>
      <span class="bar"><i style="width:${b.ms/maxB*100}%;background:var(--ink-3)"></i></span></div>`).join('')}</div>
    <p class="sub" style="font-size:12px;color:var(--ink-3);margin-top:14px">Un hueco corto suele ser un cambio que se apuntó tarde; uno largo, un rato que no llegaste a registrar. Solo se cuentan los huecos entre el primer y el último registro del día, y nunca en días de descanso.</p>
  </section>`;
}

const ANALYSES=[['resumen','Resumen'],['diatipo','Día'],['semana','Semana'],['progresion','Progreso'],['tipos','Tipos'],['huecos','Huecos']];
function viewStats(){
  const today=dayStart(Date.now()), n=state.range, a=state.analysis;
  const statDays=[]; for(let i=1;i<=n;i++) statDays.push(dayStart(today-i*DAY+HOUR*12));
  const second = a==='progresion'
    ? `<div class="catpick">${activeCats().map(c=>`<button data-statcat="${c.id}" class="${c.id===statCat()?'on':''}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div>
       <div class="seg-control">${[12,26,52].map(k=>`<button data-weeks="${k}" aria-pressed="${state.weeks===k}">${k} semanas</button>`).join('')}</div>`
    : `<div class="seg-control">${[7,14,30,90].map(k=>`<button data-range="${k}" aria-pressed="${state.range===k}">${k} días</button>`).join('')}</div>
       <p class="sub" style="font-size:12px;color:var(--ink-3);margin:2px 2px 0">${fmtDayLong(statDays[n-1])} → ${fmtDayLong(statDays[0])}. Hoy no cuenta hasta que termine.</p>`;
  return `<div class="topbar"><h1>Datos</h1>${gearBtn}</div>
    <div class="statbars">
      <div class="seg-control small">${ANALYSES.map(([k,l])=>`<button data-analysis="${k}" aria-pressed="${a===k}">${l}</button>`).join('')}</div>
      ${second}
    </div>
    ${a==='resumen'?statsResumen(statDays,n):a==='diatipo'?statsDiaTipo(statDays):a==='semana'?statsSemana(statDays):a==='tipos'?statsTipos(statDays):a==='huecos'?statsHuecos(statDays):statsProgresion()}`;
}

function viewAjustes(){
  const s=data.settings;

/* ============ Hoja de edición ============ */
function openEditor(entry){
  state.editing={id:entry.id,cat:entry.cat,start:entry.start,end:entry.end,isNew:!entry.id};
  state.sheet='edit'; renderSheet();
}
/* Insertar en la unión `t` de dos registros seguidos: el nuevo empieza con duración 0 y
   recordamos los vecinos para que, al guardar, ningún minuto quede sin dueño. */
function openInsertEditor(t){
  const prev=data.entries.filter(e=>e.end!=null&&e.end<=t).sort((a,b)=>b.end-a.end)[0];
  const next=data.entries.filter(e=>e.start>=t).sort((a,b)=>a.start-b.start)[0];
  openEditor({id:null,cat:(activeCats()[0]||data.categories[0]||{}).id,start:t,end:t});
  state.editing.joint={prev:prev?prev.id:null,next:next?next.id:null};
}
/* Inserción en una unión: los dos vecinos se ajustan al nuevo registro (se acortan o se alargan)
   para que ningún minuto quede sin dueño, siempre que entre medias no haya otro registro.
   Se aplica ANTES de resolveOverlaps, que se ocupa del resto. Devuelve los vecinos tocados. */
function jointFill(ed,target,apply){
  const j=ed.joint; if(!j) return [];
  const ts=target.start, en=target.end==null?Date.now():target.end, out=[];
  // extensión de x tal como quedará tras resolveOverlaps (null si el nuevo lo cubre entero)
  const clipped=x=>{ if(x===target||x.id===target.id) return null; const xe=endOf(x);
    if(xe<=ts||x.start>=en) return [x.start,xe];
    if(x.start<ts) return [x.start,ts];
    if(xe>en) return [en,xe];
    return null; };
  const prev=data.entries.find(e=>e.id===j.prev), next=data.entries.find(e=>e.id===j.next);
  // vecinos que se ajustarán aquí (y por tanto no cuentan como "otro registro" entre medias)
  const prevAdj=!!(prev&&prev.end!=null&&prev.start<ts), nextAdj=!!(next&&next!==prev&&endOf(next)>en);
  const between=(a,b)=>data.entries.some(x=>{ if((x===prev&&prevAdj)||(x===next&&nextAdj)) return false; const c=clipped(x); return c&&c[0]<b&&c[1]>a; });
  if(prevAdj&&prev.end!==ts&&(prev.end>ts||!between(prev.end,ts))){ out.push(prev); if(apply) prev.end=ts; }
  if(nextAdj&&next.start!==en&&(next.start<en||!between(en,next.start))){ out.push(next); if(apply) next.start=en; }
  return out;
}
function saveEditing(){
  const ed=state.editing; if(!ed) return false;
  if(ed.end!=null&&ed.end<ed.start) return false;
  if(ed.start>roundTo(Date.now())){toast('El inicio no puede ser futuro');return false;}
  let target;
  if(ed.isNew){ if(ed.end==null) ed.end=roundTo(Date.now()); if(ed.end-ed.start<MIN){toast('Duración mínima: 1 minuto');return false;} target={id:uid(),cat:ed.cat,start:ed.start,end:ed.end}; data.entries.push(target); }
  else { target=data.entries.find(x=>x.id===ed.id); if(target){target.cat=ed.cat;target.start=ed.start;target.end=ed.end;} }
  if(target){ jointFill(ed,target,true); resolveOverlaps(target); }
  sortEntries(); save(); closeSheet(); render(); toast('Guardado'); return true;
}
function newManualEntry(ds){
  const now=Date.now();
  let end=dayKey(ds)===dayKey(now)?roundTo(now):ds+18*HOUR, start=end-30*MIN;
  const prev=[...data.entries].filter(e=>endOf(e)<=end).sort((a,b)=>endOf(b)-endOf(a))[0];
  if(prev&&end-endOf(prev)<6*HOUR&&end-endOf(prev)>MIN) start=endOf(prev);
  openEditor({id:null,cat:(activeCats()[0]||data.categories[0]||{}).id,start,end});
}
// Dos saltos por lado: el paso configurado y uno grande (el triple, o 5 min si el paso es 1).
/* Mueve el inicio de la actividad en marcha. Si la anterior terminaba justo donde
   empezaba esta, su fin la acompaña: al restar y volver a sumar no se abre un hueco
   artificial entre las dos. */
function setRunningStart(ns){
  const r=running(); if(!r) return false;
  if(ns>roundTo(Date.now())){toast('El inicio no puede ser futuro');return false;}
  const p=prevEntry(r), glued=p&&p.end!=null&&p.end===r.start;
  r.start=ns;
  if(glued&&ns>p.start&&ns<=roundTo(Date.now())) p.end=ns;
  const m=resolveOverlaps(r); if(m) toast(m);
  save(); return true;
}
function adjButtons(attr,plus){
  const steps=[STEP(),STEP()===1?5:STEP()*3];
  const list=plus?steps:steps.slice().reverse();
  return list.map(n=>`<button data-${attr}="${plus?n:-n}">${plus?'+':'−'}${n}</button>`).join('');
}
function timeCol(field,ms,label,extra){
  return `<div class="se" data-field="${field}">
    <div class="label">${label}</div>
    <input type="time" step="${STEP()*60}" value="${fmtTime(ms)}" data-tinput="${field}" aria-label="${label}">
    <div class="se-adj">${adjButtons('tadj')}${adjButtons('tadj',true)}</div>
    ${extra||''}</div>`;
}
/* El botón atrás del móvil cierra la hoja abierta: mientras hay hoja, hay una entrada
   extra en el historial. Cerrarla desde la app la retira con history.back(). */
let sheetHist=false;
function syncSheetHistory(){
  if(state.sheet&&!sheetHist){sheetHist=true;history.pushState({sheet:1},'');}

}
